name: Update YouTube Streams

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'
  push:
    paths:
      - 'streams.txt'
      - 'generate.py'

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Setup Python & dependencies
        run: |
          pip install --upgrade pip yt-dlp requests
          echo "yt-dlp: $(yt-dlp --version)"

      - name: Setup Cloudflare WARP
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools iptables
          curl -fsSL https://github.com/ViRb3/wgcf/releases/download/v2.2.22/wgcf_2.2.22_linux_amd64 -o wgcf
          chmod +x wgcf
          sudo mv wgcf /usr/local/bin/
          wgcf register --accept-tos
          wgcf generate
          sudo mkdir -p /etc/wireguard
          sudo cp wgcf-profile.conf /etc/wireguard/wgcf.conf
          sudo wg-quick up /etc/wireguard/wgcf.conf || true

      - name: Write cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -z "$YOUTUBE_COOKIES" ]; then
            echo "No cookies found"
            exit 1
          fi
          echo "$YOUTUBE_COOKIES" > cookies.txt
          echo "Lines: $(wc -l < cookies.txt)"

      - name: Create directories
        run: |
          mkdir -p channels
          touch channels/.gitkeep

      - name: Run generator with retry
        run: |
          set +e
          WAITS="0 120 300"          # wait (seconds) before attempts 1, 2, 3
          ATTEMPT=0
          GEN_OK=false

          for W in $WAITS; do
            ATTEMPT=$((ATTEMPT+1))
            if [ "$W" -gt 0 ]; then
              echo "⏳ waiting ${W}s before attempt ${ATTEMPT}..."
              sleep "$W"
            fi
            echo "🔄 Attempt ${ATTEMPT}..."

            rm -f stats.json                       # so a crash can't read a stale success
            python generate.py

            LIVE=$(python -c "import json;print(json.load(open('stats.json'))['live'])" 2>/dev/null || echo 0)
            echo "ℹ️ live=${LIVE}"

            if [ "${LIVE:-0}" -gt 0 ]; then
              echo "✅ Got ${LIVE} live stream(s) on attempt ${ATTEMPT}"
              GEN_OK=true
              break
            fi
            echo "⚠️ Attempt ${ATTEMPT} produced no live streams"
          done

          echo "GEN_OK=${GEN_OK}" >> "$GITHUB_ENV"

          if [ "$GEN_OK" != true ]; then
            # Soft-fail: DON'T fail the job (no red run / no email), just skip the commit
            # so the last good streams stay in the repo. This run will show green with a warning.
            echo "::warning::No live streams this run - keeping last good version, skipping commit"
            # Optional: get a push alert instead of the GitHub email. Uncomment + set your topic:
            # curl -s -d "yt-tube: no live streams this run" https://ntfy.sh/YOUR_TOPIC || true
          fi

      - name: Stop WARP before push
        continue-on-error: true
        run: sudo wg-quick down /etc/wireguard/wgcf.conf || true

      - name: Commit and push
        if: env.GEN_OK == 'true'
        timeout-minutes: 5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/belandteam-source/yt-tube.git
          git add streams*.m3u8 stats.json channels/ || true
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update streams $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:main --force

      - name: Cleanup
        if: always()
        run: |
          sudo wg-quick down /etc/wireguard/wgcf.conf 2>/dev/null || true
          rm -f cookies.txt wgcf-profile.conf wgcf-account.toml 2>/dev/null || true
