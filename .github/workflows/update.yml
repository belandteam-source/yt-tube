name: Update YouTube Streams
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'
  push:
    paths:
      - 'streams.txt'
      - 'generate.py'
permissions:
  contents: write
env:
  PYTHONUNBUFFERED: "1"
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0
      - name: Setup Python & dependencies
        run: |
          pip install --upgrade pip yt-dlp requests
          echo "yt-dlp: $(yt-dlp --version)"
      - name: Write cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -z "$YOUTUBE_COOKIES" ]; then
            echo "No cookies found"
            exit 1
          fi
          echo "$YOUTUBE_COOKIES" > cookies.txt
      - name: Create directories
        run: |
          mkdir -p channels
          touch channels/.gitkeep
      - name: Run generator
        run: python generate.py
      - name: Commit and push
        timeout-minutes: 15
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/belandteam-source/yt-tube.git
          git add streams*.m3u8 stats.json channels/ || true
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Update streams $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:main --force
      - name: Cleanup
        if: always()
        run: rm -f cookies.txt wgcf-profile.conf wgcf-account.toml 2>/dev/null || true
