name: Update YouTube Streams

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'
  push:
    paths:
      - 'streams.txt'
      - 'generate.py'

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Setup Python & dependencies
        run: |
          pip install --upgrade pip yt-dlp requests
          echo "yt-dlp: $(yt-dlp --version)"

      - name: Setup Cloudflare WARP
        continue-on-error: true
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools iptables
          curl -fsSL https://github.com/ViRb3/wgcf/releases/download/v2.2.22/wgcf_2.2.22_linux_amd64 -o wgcf
          chmod +x wgcf
          sudo mv wgcf /usr/local/bin/
          wgcf register --accept-tos
          wgcf generate
          sudo mkdir -p /etc/wireguard
          sudo cp wgcf-profile.conf /etc/wireguard/wgcf.conf
          sudo sed -i 's/^Table = .*//' /etc/wireguard/wgcf.conf || true
          sudo sed -i '/^DNS/d' /etc/wireguard/wgcf.conf || true

          # First attempt to bring up WARP
          sudo wg-quick up /etc/wireguard/wgcf.conf || true
          echo "Waiting 15 seconds for WARP to stabilize..."
          sleep 15

          # Verify WARP connection
          IP=$(curl -s --max-time 10 https://cloudflare.com/cdn-cgi/trace | grep "^ip=" | cut -d= -f2)
          echo "Current IP after WARP: $IP"

          if [[ "$IP" == 172.* ]] || [[ "$IP" == 2606:* ]]; then
            echo "✅ WARP connected successfully - IP: $IP"
          else
            echo "⚠️ WARP not connected (IP: $IP) - trying restart..."
            sudo wg-quick down /etc/wireguard/wgcf.conf || true
            sleep 5
            sudo wg-quick up /etc/wireguard/wgcf.conf || true
            sleep 15

            # Check again
            IP2=$(curl -s --max-time 10 https://cloudflare.com/cdn-cgi/trace | grep "^ip=" | cut -d= -f2)
            echo "IP after restart: $IP2"
            if [[ "$IP2" == 172.* ]] || [[ "$IP2" == 2606:* ]]; then
              echo "✅ WARP connected after restart - IP: $IP2"
            else
              echo "⚠️ WARP still not connected - continuing anyway with IP: $IP2"
            fi
          fi

      - name: Write cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -z "$YOUTUBE_COOKIES" ]; then
            echo "No cookies found"
            exit 1
          fi
          printf '%s\n' "$YOUTUBE_COOKIES" > cookies.txt
          echo "Lines: $(wc -l < cookies.txt)"

      - name: Create directories
        run: |
          mkdir -p channels
          touch channels/.gitkeep

      - name: Run generator with retry
        run: |
          SUCCESS=false

          # Attempt 1
          echo "🔄 Attempt 1 of 3..."
          python generate.py
          if grep -q "manifest.googlevideo.com" streams.m3u8; then
            echo "✅ Real streams found on attempt 1"
            SUCCESS=true
          fi

          # Attempt 2 - wait 2 minutes
          if [ "$SUCCESS" = false ]; then
            echo "⚠️ Attempt 1 failed - waiting 2 minutes before retry..."
            sleep 120
            echo "🔄 Attempt 2 of 3..."
            python generate.py
            if grep -q "manifest.googlevideo.com" streams.m3u8; then
              echo "✅ Real streams found on attempt 2"
              SUCCESS=true
            fi
          fi

          # Attempt 3 - wait 5 minutes
          if [ "$SUCCESS" = false ]; then
            echo "⚠️ Attempt 2 failed - waiting 5 minutes before retry..."
            sleep 300
            echo "🔄 Attempt 3 of 3..."
            python generate.py
            if grep -q "manifest.googlevideo.com" streams.m3u8; then
              echo "✅ Real streams found on attempt 3"
              SUCCESS=true
            fi
          fi

          if [ "$SUCCESS" = false ]; then
            echo "❌ All 3 attempts failed - keeping last good version on GitHub"
            exit 1
          fi

      - name: Stop WARP before push
        continue-on-error: true
        run: |
          sudo wg-quick down /etc/wireguard/wgcf.conf || true
          echo "WARP stopped"

      - name: Commit and push
        timeout-minutes: 5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/belandteam-source/yt-tube.git
          git add streams*.m3u8 stats.json channels/ || true
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update streams $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:main --force

      - name: Cleanup
        if: always()
        run: |
          sudo wg-quick down /etc/wireguard/wgcf.conf 2>/dev/null || true
          rm -f cookies.txt wgcf-profile.conf wgcf-account.toml 2>/dev/null || true
