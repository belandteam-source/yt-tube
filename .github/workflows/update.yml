name: Update YouTube Streams

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'
  push:
    paths:
      - 'streams.txt'
      - 'generate.py'

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Setup Python & dependencies
        run: |
          pip install --upgrade pip yt-dlp requests
          echo "yt-dlp: $(yt-dlp --version)"

      - name: Setup Cloudflare WARP
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools iptables
          curl -fsSL https://github.com/ViRb3/wgcf/releases/download/v2.2.22/wgcf_2.2.22_linux_amd64 -o wgcf
          chmod +x wgcf
          sudo mv wgcf /usr/local/bin/
          wgcf register --accept-tos
          wgcf generate
          sudo mkdir -p /etc/wireguard
          sudo cp wgcf-profile.conf /etc/wireguard/wgcf.conf
          sudo wg-quick up /etc/wireguard/wgcf.conf || true

      - name: Write cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -z "$YOUTUBE_COOKIES" ]; then
            echo "No cookies found"
            exit 1
          fi
          echo "$YOUTUBE_COOKIES" > cookies.txt
          echo "Lines: $(wc -l < cookies.txt)"

      - name: Create directories
        run: |
          mkdir -p channels
          touch channels/.gitkeep

      - name: Run generator with retry
        run: |
          SUCCESS=false

          echo "🔄 Attempt 1 of 3..."
          python generate.py
          if grep -q "manifest.googlevideo.com" streams.m3u8; then
            echo "✅ Real streams found on attempt 1"
            SUCCESS=true
          fi

          if [ "$SUCCESS" = false ]; then
            echo "⚠️ Attempt 1 failed - waiting 2 minutes..."
            sleep 120
            echo "🔄 Attempt 2 of 3..."
            python generate.py
            if grep -q "manifest.googlevideo.com" streams.m3u8; then
              echo "✅ Real streams found on attempt 2"
              SUCCESS=true
            fi
          fi

          if [ "$SUCCESS" = false ]; then
            echo "⚠️ Attempt 2 failed - waiting 5 minutes..."
            sleep 300
            echo "🔄 Attempt 3 of 3..."
            python generate.py
            if grep -q "manifest.googlevideo.com" streams.m3u8; then
              echo "✅ Real streams found on attempt 3"
              SUCCESS=true
            fi
          fi

          if [ "$SUCCESS" = false ]; then
            echo "❌ All attempts failed - keeping last good version"
            exit 1
          fi

      - name: Stop WARP before push
        continue-on-error: true
        run: sudo wg-quick down /etc/wireguard/wgcf.conf || true

      - name: Commit and push
        timeout-minutes: 5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/belandteam-source/yt-tube.git
          git add streams*.m3u8 stats.json channels/ || true
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update streams $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:main --force

      - name: Cleanup
        if: always()
        run: |
          sudo wg-quick down /etc/wireguard/wgcf.conf 2>/dev/null || true
          rm -f cookies.txt wgcf-profile.conf wgcf-account.toml 2>/dev/null || true
