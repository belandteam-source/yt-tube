name: Update YouTube Streams

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yt-dlp requests

      - name: Run generator
        run: python generate.py

      - name: Commit and push updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add streams.m3u8 streams_hd.m3u8 streams_mobile.m3u8 stats.json channels/ || true
          git diff --staged --quiet || git commit -m "🔄 Update streams - $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
